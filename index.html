<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purple Flower 💜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #050008;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flower-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .flower {
      position: absolute;
      left: 50%;
      bottom: 18%;
      width: 10px;
      height: 260px;
      background: linear-gradient(to top, #172b12, #4d8b32);
      border-radius: 10px;
      transform-origin: bottom;
      animation: sway 4s ease-in-out infinite;
    }

    .leaf {
      position: absolute;
      width: 90px;
      height: 38px;
      background: linear-gradient(135deg, #244b19, #6cae45);
      border-radius: 100% 0 100% 0;
    }

    .leaf.left {
      left: -75px;
      top: 145px;
      transform: rotate(-25deg);
    }

    .leaf.right {
      left: 5px;
      top: 185px;
      transform: rotate(25deg) scaleX(-1);
    }

    .petals {
      position: absolute;
      left: 50%;
      top: -5px;
      width: 130px;
      height: 130px;
      transform: translateX(-50%);
      animation: glow 3s ease-in-out infinite;
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 85px;
      transform-origin: 50% 100%;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(
        180deg,
        #e5b7ff,
        #a855f7 45%,
        #6d28d9
      );
      box-shadow:
        0 0 12px #a855f7,
        0 0 28px rgba(168, 85, 247, 0.7);
    }

    .p1 { transform: translate(-50%, -100%) rotate(0deg); }
    .p2 { transform: translate(-50%, -100%) rotate(72deg); }
    .p3 { transform: translate(-50%, -100%) rotate(144deg); }
    .p4 { transform: translate(-50%, -100%) rotate(216deg); }
    .p5 { transform: translate(-50%, -100%) rotate(288deg); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffe58a, #f59e0b 60%, #b45309);
      box-shadow: 0 0 15px #fbbf24;
      z-index: 5;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px #d8b4fe;
      animation: float 4s linear infinite;
    }

    .s1 { left: 20%; top: 25%; animation-delay: 0s; }
    .s2 { left: 75%; top: 30%; animation-delay: 1s; }
    .s3 { left: 30%; top: 65%; animation-delay: 2s; }
    .s4 { left: 82%; top: 70%; animation-delay: 3s; }

    @keyframes sway {
      0%, 100% {
        transform: rotate(-3deg);
      }
      50% {
        transform: rotate(3deg);
      }
    }

    @keyframes glow {
      0%, 100% {
        filter: brightness(0.9);
      }
      50% {
        filter: brightness(1.25);
      }
    }

    @keyframes float {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.5);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(1.3);
      }
    }
  </style>
</head>

<body>

  <div id="flower-container">

    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>

    <div class="flower">

      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="petals">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>

        <div class="center"></div>
      </div>

    </div>

  </div>

</body>
</html>
